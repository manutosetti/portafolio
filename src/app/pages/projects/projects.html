<section class="projects">
  <div class="projects-container">

    @for (proyecto of projects; track proyecto.id) {
      <div class="card">
        <div class="card-content">
          <h3>{{ proyecto.nombre }}</h3>
          <p>{{ proyecto.tecnologias }}</p>
          <a href="{{proyecto.link}}">ir</a>
          </div>
        </div>
    }

  </div>
</section>
